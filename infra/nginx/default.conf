upstream legatrixon_backend {
  server backend:3000;
  keepalive 32;
}

limit_req_zone $binary_remote_addr zone=legatrixon_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=legatrixon_auth:10m rate=3r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=legatrixon_api burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://legatrixon_backend;
  }

  location ~ ^/(health|metrics) {
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_pass http://legatrixon_backend;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}