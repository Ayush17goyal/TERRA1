        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        value: https://legatrixon-3.vercel.app
      - key: SQLITE_DB_PATH
        value: /var/data/legatrixon_db.sqlite
      - key: REDIS_URL
        fromService:
          name: legatrixon-redis
          property: connectionString
