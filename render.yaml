services:
  - type: web
    name: legatrixon-backend
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CLIENT_ORIGINS
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          name: legatrixon-redis
          type: redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PORTAL_ID
        sync: false
      - key: ADMIN_PORTAL_PASSWORD_HASH
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SECURITY_EMAIL_FROM
        sync: false
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: DEMO_LIMIT_PER_FEATURE_PER_DAY
        value: "4"
      - key: VIRUS_SCAN_MODE
        value: required
      - key: VIRUS_SCAN_COMMAND
        sync: false
      - key: SUPABASE_DISABLED
        value: "false"
      - key: LEARNING_INDEXING_CONCURRENCY
        value: "2"
      - key: LEARNING_CHUNK_SIZE
        value: "1400"

  - type: redis
    name: legatrixon-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    version: "7"
